<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Árbol de Sistemas</title>
<link rel="stylesheet" href="css/01-theme.css">
<link rel="stylesheet" href="css/02-base.css">
<link rel="stylesheet" href="css/03-topbar.css">
<link rel="stylesheet" href="css/04-canvas.css">
<link rel="stylesheet" href="css/05-nodes.css">
<link rel="stylesheet" href="css/06-floating.css">
<link rel="stylesheet" href="css/07-popover.css">
<link rel="stylesheet" href="css/08-admin.css">
<link rel="stylesheet" href="css/09-dialogs.css">
<link rel="stylesheet" href="css/10-responsive.css">
</head>
<body>

<!-- ====================== Barra superior ====================== -->
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2.5"/><rect x="6.5" y="9" width="5" height="4.5" rx="1"/><rect x="13" y="13" width="4.5" height="4.5" rx="1"/><path d="M3 7h18"/></svg>
    <span>Árbol de Sistemas</span>
  </div>
  <button class="btn primary" id="btnNew" title="Nueva card (N)">＋ <span class="hide-sm">Nueva card</span></button>
  <button class="btn" id="btnLayout" title="Auto-layout jerárquico">⇅ <span class="hide-sm">Auto-layout</span></button>
  <div class="segmented" id="toolSeg" title="Herramienta: V selección · H mano">
    <button data-tool="select" class="active" title="Seleccionar (V)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3l14 8-6 2-3 7z"/></svg><span class="hide-sm">Mover</span>
    </button>
    <button data-tool="hand" title="Mano (H)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v1M14 10V4a2 2 0 0 0-4 0v2M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2a8 8 0 0 1-6.4-3.2L3.1 15.3a2 2 0 0 1 3.3-2.3L8 15"/></svg><span class="hide-sm">Mano</span>
    </button>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="btnUndo" title="Deshacer (Ctrl/⌘+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></button>
  <button class="icon-btn" id="btnRedo" title="Rehacer (Ctrl/⌘+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg></button>
  <span class="save-status" id="saveStatus"></span>
  <div class="sep"></div>
  <button class="theme-switch" id="themeSwitch" title="Cambiar tema" aria-label="Cambiar tema">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="icon-btn" id="btnHelp" title="Atajos de teclado (?)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg></button>
  <button class="btn" id="btnAdmin" title="Panel de administración">⚙ <span class="hide-sm">Administrar</span></button>
</header>

<!-- ====================== Lienzo ====================== -->
<main id="viewport">
  <div id="world">
    <svg id="edges" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow-ds" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z"/></marker>
        <marker id="arrow-source" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0.5 L10 5 L0 9.5 z"/></marker>
      </defs>
      <g id="edgeLayer"></g>
      <path id="tempEdge" d="" hidden></path>
    </svg>
    <div id="nodes"></div>
  </div>
  <svg id="guides" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="marquee" hidden></div>

  <div class="float" id="legend">
    <span><i class="lg-box"></i> anidado = ramificación</span>
    <span><svg viewBox="0 0 28 10"><line class="lg-ds" x1="0" y1="5" x2="28" y2="5"/></svg> usa su DS</span>
    <span><svg viewBox="0 0 28 10"><line class="lg-ext" x1="0" y1="5" x2="28" y2="5"/></svg> usa DS de otro software</span>
    <span><svg viewBox="0 0 28 10"><line class="lg-src" x1="0" y1="5" x2="28" y2="5"/></svg> UI Kit deriva de</span>
  </div>
  <div class="float" id="statusBar"></div>
  <canvas class="float" id="minimap" width="200" height="130"></canvas>
  <div class="float" id="zoomBar">
    <button class="icon-btn" id="zoomOut" title="Alejar (−)">−</button>
    <button class="zoom-label" id="zoomLabel" title="Restablecer a 100%">100%</button>
    <button class="icon-btn" id="zoomIn" title="Acercar (+)">+</button>
    <button class="icon-btn" id="zoomFit" title="Ajustar a pantalla (Shift+1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
  </div>
  <div class="float" id="toasts"></div>
</main>

<!-- ====================== Panel de administración ====================== -->
<aside class="panel" id="adminPanel" aria-label="Administración">
  <header><h2>Administración</h2><button class="icon-btn" id="closeAdmin" title="Cerrar">✕</button></header>
  <nav class="tabs" id="adminTabs">
    <button data-tab="tags" class="active">Etiquetas</button>
    <button data-tab="edgeTypes">Ramificaciones</button>
    <button data-tab="owners">Responsables</button>
    <button data-tab="data">Datos</button>
    <button data-tab="settings">Ajustes</button>
  </nav>
  <div class="panel-body" id="adminBody"></div>
</aside>

<!-- ====================== Popover / diálogos ====================== -->
<div id="popover" hidden></div>
<dialog id="editorDialog"></dialog>
<dialog id="confirmDialog"></dialog>
<dialog id="shortcutsDialog"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="js/core/utils.js"></script>
<script src="js/core/state.js"></script>
<script src="js/core/history.js"></script>
<script src="js/canvas/camera.js"></script>
<script src="js/canvas/render-nodes.js"></script>
<script src="js/canvas/render-edges.js"></script>
<script src="js/canvas/selection.js"></script>
<script src="js/canvas/minimap.js"></script>
<script src="js/canvas/pointer-gestures.js"></script>
<script src="js/canvas/pointer-drag.js"></script>
<script src="js/canvas/keyboard.js"></script>
<script src="js/ui/popover.js"></script>
<script src="js/ui/connections.js"></script>
<script src="js/ui/dialogs.js"></script>
<script src="js/ui/card-editor.js"></script>
<script src="js/ui/node-actions.js"></script>
<script src="js/views/admin.js"></script>
<script src="js/canvas/layout.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/main.js"></script>
</body>
</html>
