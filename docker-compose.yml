# DesTree. `cp .env.example .env && docker compose up -d` → http://localhost:3000
services:
  destree:
    build: .
    image: ghcr.io/carlosfis/destree:latest
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_PATH: /data/destree.db
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/data
  # Perfil https: TLS automático con Caddy. Requiere DOMAIN en .env y puertos 80/443 libres.
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - destree
  # Perfil dev: buzón de pruebas Mailpit (UI en :8025, SMTP en :1025). En .env: SMTP_URL=smtp://mailpit:1025, MAIL_FROM=DesTree <dev@localhost>
  mailpit:
    image: axllent/mailpit
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
volumes:
  caddy_data:
  caddy_config:
