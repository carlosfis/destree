<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Árbol de Sistemas</title>
<style>
/* =========================================================
   1. Variables y tema
   ========================================================= */
:root {
  --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;

  --bg: #ffffff;
  --bg-canvas: #fbfbfa;
  --panel: #ffffff;
  --fg: #37352f;
  --fg-2: #787774;
  --fg-3: #9b9a97;
  --border: rgba(55, 53, 47, 0.16);
  --border-strong: rgba(55, 53, 47, 0.32);
  --hover: rgba(55, 53, 47, 0.06);
  --active: rgba(55, 53, 47, 0.1);
  --ctr-bg: rgba(55, 53, 47, 0.025);
  --ctr-root-bg: rgba(55, 53, 47, 0.04);
  --accent: #2383e2;
  --accent-soft: rgba(35, 131, 226, 0.14);
  --danger: #eb5757;
  --danger-soft: rgba(235, 87, 87, 0.12);
  --grid-dot: rgba(55, 53, 47, 0.2);
  --shadow: 0 1px 2px rgba(15, 15, 15, 0.06), 0 1px 1px rgba(15, 15, 15, 0.04);
  --shadow-md: 0 4px 12px rgba(15, 15, 15, 0.1), 0 1px 3px rgba(15, 15, 15, 0.06);
  --shadow-lg: 0 14px 36px rgba(15, 15, 15, 0.16), 0 3px 8px rgba(15, 15, 15, 0.08);
  --edge-source: #c29343;
  --guide: #ff4fa3;

  --c-software: #2383e2;
  --c-ds: #9065b0;
  --c-uikit: #d9730d;

  --radius: 6px;
  --radius-lg: 10px;
}
:root[data-theme="dark"] {
  --bg: #191919;
  --bg-canvas: #191919;
  --panel: #202020;
  --fg: #d4d4d4;
  --fg-2: #9b9b9b;
  --fg-3: #6f6f6f;
  --border: rgba(255, 255, 255, 0.13);
  --border-strong: rgba(255, 255, 255, 0.3);
  --hover: rgba(255, 255, 255, 0.055);
  --active: rgba(255, 255, 255, 0.1);
  --ctr-bg: rgba(255, 255, 255, 0.025);
  --ctr-root-bg: rgba(255, 255, 255, 0.04);
  --accent: #529cca;
  --accent-soft: rgba(82, 156, 202, 0.2);
  --danger: #ff7369;
  --danger-soft: rgba(255, 115, 105, 0.16);
  --grid-dot: rgba(255, 255, 255, 0.16);
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 1px 1px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 14px 36px rgba(0, 0, 0, 0.55), 0 3px 8px rgba(0, 0, 0, 0.35);
  --edge-source: #d4a25a;
  --c-software: #529cca;
  --c-ds: #b58ad1;
  --c-uikit: #e8923d;
}

/* Chips de etiquetas (paleta tipo Notion) */
.tag-gray   { background: #e3e2e0; color: #32302c; }
.tag-brown  { background: #eee0da; color: #442a1e; }
.tag-orange { background: #fadec9; color: #49290e; }
.tag-yellow { background: #fdecc8; color: #402c1b; }
.tag-green  { background: #dbeddb; color: #1c3829; }
.tag-blue   { background: #d3e5ef; color: #183347; }
.tag-purple { background: #e8deee; color: #412454; }
.tag-pink   { background: #f5e0e9; color: #4c2337; }
.tag-red    { background: #ffe2dd; color: #5d1715; }
:root[data-theme="dark"] .tag-gray   { background: #5a5a5a; color: #f0f0f0; }
:root[data-theme="dark"] .tag-brown  { background: #603b2c; color: #f0e4dc; }
:root[data-theme="dark"] .tag-orange { background: #854c1d; color: #fbe6d4; }
:root[data-theme="dark"] .tag-yellow { background: #89632a; color: #fbefd6; }
:root[data-theme="dark"] .tag-green  { background: #2b593f; color: #dcefe0; }
:root[data-theme="dark"] .tag-blue   { background: #28456c; color: #d8e6f3; }
:root[data-theme="dark"] .tag-purple { background: #492f64; color: #e8dcf1; }
:root[data-theme="dark"] .tag-pink   { background: #69314c; color: #f5dde8; }
:root[data-theme="dark"] .tag-red    { background: #6e3630; color: #fadcd8; }

/* =========================================================
   2. Base y layout general
   ========================================================= */
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  color: var(--fg);
  background: var(--bg-canvas);
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
kbd {
  font-family: var(--mono); font-size: 11px; padding: 1px 5px;
  border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px;
  background: var(--hover); color: var(--fg-2); white-space: nowrap;
}

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--panel);
  font-size: 13px; font-weight: 500; line-height: 20px; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--hover); }
.btn:active { background: var(--active); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn:disabled { opacity: .45; cursor: default; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 28px; height: 28px; border-radius: var(--radius); color: var(--fg-2);
  transition: background .12s, color .12s;
}
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn svg { width: 16px; height: 16px; }

input[type="text"], input[type="search"], input:not([type]), textarea, select {
  width: 100%; padding: 6px 8px; border-radius: var(--radius);
  border: 1px solid var(--border); background: var(--bg);
  outline: none; transition: border-color .12s, box-shadow .12s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
textarea { resize: vertical; min-height: 52px; }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 0 6px; border-radius: 4px; font-size: 11.5px; font-weight: 500;
  line-height: 18px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}

/* =========================================================
   3. Barra superior
   ========================================================= */
.topbar {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--border);
  position: relative; z-index: 20; flex-wrap: wrap;
}
.topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-right: 4px; }
.topbar .brand svg { width: 20px; height: 20px; }
.topbar .spacer { flex: 1; }
.topbar .sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.segmented button {
  padding: 4px 9px; font-size: 13px; color: var(--fg-2); display: inline-flex; align-items: center; gap: 6px;
  border-right: 1px solid var(--border);
}
.segmented button:last-child { border-right: 0; }
.segmented button:hover { background: var(--hover); }
.segmented button.active { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.save-status { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.theme-switch {
  position: relative; width: 40px; height: 22px; border-radius: 11px; background: var(--border);
  border: 0; transition: background .2s; flex: none;
}
.theme-switch::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--panel); box-shadow: var(--shadow); transition: transform .2s;
}
:root[data-theme="dark"] .theme-switch { background: var(--accent); }
:root[data-theme="dark"] .theme-switch::after { transform: translateX(18px); }
.theme-switch svg { position: absolute; top: 5px; width: 12px; height: 12px; color: var(--fg-2); }
.theme-switch .sun { left: 5px; }
.theme-switch .moon { right: 5px; }

/* =========================================================
   4. Lienzo
   ========================================================= */
#viewport {
  position: relative; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  background-color: var(--bg-canvas);
  background-image: radial-gradient(circle, var(--grid-dot) 1px, transparent 1.2px);
  cursor: default;
}
#viewport.no-grid { background-image: none; }
#viewport.space-pan, #viewport.tool-hand { cursor: grab; }
#viewport.panning { cursor: grabbing !important; }
#viewport.connecting { cursor: crosshair; }
#world { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
#nodes { position: absolute; left: 0; top: 0; }
#guides { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 5; }
#marquee {
  position: absolute; border: 1px solid var(--accent); background: var(--accent-soft);
  pointer-events: none; z-index: 4; border-radius: 2px;
}

/* --- Aristas (SVG) --- */
.edge .hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.edge .line { fill: none; stroke-width: 1.6; stroke-linecap: round; transition: opacity .15s; }
.edge.kind-ds .line { stroke: var(--accent); stroke-width: 2.3; marker-end: url(#arrow-ds); }
.edge.kind-ds.external .line { stroke-dasharray: 9 6; }
.edge.kind-source .line { stroke: var(--edge-source); stroke-width: 1.8; stroke-dasharray: 2 6; marker-end: url(#arrow-source); }
.edge text {
  font-size: 11px; fill: var(--fg-2); paint-order: stroke; stroke: var(--bg-canvas); stroke-width: 4px;
  stroke-linejoin: round; text-anchor: middle; dominant-baseline: middle; pointer-events: none; font-family: var(--font);
}
.edge.kind-ds.external text { fill: var(--accent); font-weight: 500; }
.edge.selected .line { stroke-width: 3; filter: drop-shadow(0 0 3px var(--accent-soft)); }
.edge.selected text { font-weight: 600; }
.edge.dim { opacity: .15; }
.edge.dim .hit { pointer-events: none; }
#tempEdge { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; pointer-events: none; }
#arrow-ds path { fill: var(--accent); }
#arrow-source path { fill: var(--edge-source); }

/* --- Guías inteligentes --- */
#guides line { stroke: var(--guide); stroke-width: 1; }
#guides text { font-size: 10px; fill: var(--guide); font-family: var(--mono); text-anchor: middle; paint-order: stroke; stroke: var(--bg-canvas); stroke-width: 3px; }
#guides .gap { stroke-dasharray: 3 3; }

/* =========================================================
   5. Nodos: contenedores (software) y cards hoja (DS / UI Kit)
   ========================================================= */
.node { position: absolute; left: 0; top: 0; will-change: transform; transition: box-shadow .15s, opacity .18s, border-color .12s; }
.node.dragging { transition: none; z-index: 1000; }
.node.lift { z-index: 900; }

/* Contenedor */
.ctr {
  border: 1px solid var(--border); border-radius: 12px; background: var(--ctr-bg); cursor: grab;
  min-width: 300px;
}
.ctr.root { border: 1.5px solid var(--border-strong); background: var(--ctr-root-bg); border-radius: 14px; }
.ctr:hover { border-color: var(--border-strong); }
.ctr.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.ctr.dragging { box-shadow: var(--shadow-lg); cursor: grabbing; }
.ctr.drop-target { border-color: var(--accent); border-style: dashed; background: var(--accent-soft); }
.ctr.dim { border-color: var(--border); }
.ctr.dim > .ctr-head { opacity: .3; }
.ctr.target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.ctr-head {
  position: relative; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px;
  border-radius: 11px 11px 0 0; background: var(--panel); border-bottom: 1px solid var(--border); cursor: grab;
}
.ctr.root > .ctr-head { padding: 12px 16px; border-radius: 13px 13px 0 0; }
.ctr.nested > .ctr-head { background: transparent; border-bottom: 1px dashed var(--border); }
.head-top { display: flex; align-items: center; gap: 8px; }
.head-top .spacer { flex: 1; }
.head-actions { display: inline-flex; gap: 2px; opacity: 0; transition: opacity .12s; }
.ctr-head:hover .head-actions, .ctr.selected > .ctr-head .head-actions { opacity: 1; }
.head-actions .icon-btn { width: 22px; height: 22px; font-size: 15px; line-height: 1; }
.head-main { display: flex; gap: 10px; align-items: flex-start; }
.head-main .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; flex: none; border: 1px solid var(--border); pointer-events: none; }
.head-main .texts { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.ctr.root .card-name { font-size: 15.5px; }
.ctr-empty {
  position: absolute; left: 16px; right: 16px; bottom: 16px; top: auto; height: 60px; display: grid; place-items: center;
  border: 1px dashed var(--border); border-radius: 8px; color: var(--fg-3); font-size: 12px; pointer-events: none; text-align: center; padding: 0 8px;
}
.resize {
  position: absolute; right: -1px; bottom: -1px; width: 16px; height: 16px; cursor: nwse-resize; border-radius: 0 0 12px 0;
  background: linear-gradient(135deg, transparent 50%, var(--border-strong) 50%, var(--border-strong) 60%, transparent 60%, transparent 75%, var(--border-strong) 75%, var(--border-strong) 85%, transparent 85%);
  opacity: 0; transition: opacity .12s;
}
.ctr:hover > .resize, .ctr.selected > .resize { opacity: 1; }

/* Card hoja */
.leaf {
  width: 220px; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow); cursor: grab;
}
.leaf:hover { border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.leaf.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft), var(--shadow-md); }
.leaf.dragging { box-shadow: var(--shadow-lg); cursor: grabbing; }
.leaf.dim { opacity: .28; }
.leaf.target { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-lg); }
.leaf .card-img { height: 112px; border-radius: 9px 9px 0 0; overflow: hidden; background: var(--hover); border-bottom: 1px solid var(--border); }
.leaf .card-img img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.leaf .card-body { padding: 10px 12px 11px; display: flex; flex-direction: column; gap: 6px; }
.type-ds { border-left: 3px solid var(--c-ds); }
.type-uikit { border-left: 3px solid var(--c-uikit); }

/* Contenido compartido entre contenedor y hoja */
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.type-badge {
  display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; letter-spacing: .02em;
  text-transform: uppercase; color: var(--fg-2); white-space: nowrap;
}
.type-badge::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c-software); flex: none; }
.type-ds .type-badge::before { border-radius: 50%; background: var(--c-ds); }
.type-uikit .type-badge::before { border-radius: 2px 50% 50% 2px; background: var(--c-uikit); }
.ctr.root > .ctr-head .type-badge { color: var(--accent); }
.card-menu { width: 22px; height: 22px; opacity: 0; font-size: 16px; line-height: 1; }
.leaf:hover .card-menu, .leaf.selected .card-menu { opacity: 1; }
.card-name { font-weight: 600; font-size: 14px; line-height: 1.3; word-wrap: break-word; }
.card-desc { font-size: 12.5px; color: var(--fg-2); line-height: 1.35; word-wrap: break-word; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.card-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 2px; font-size: 12px; color: var(--fg-2); }
.owner { font-family: var(--mono); font-size: 11.5px; color: var(--fg-2); background: var(--hover); padding: 0 5px; border-radius: 4px; }
.ds-ref { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 500; }
.ds-ref::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
.ds-ref.none { color: var(--fg-3); font-weight: 400; }
.ds-ref.none::before { background: var(--fg-3); opacity: .5; }
.ds-ref.ext::before { background: transparent; border: 1.5px dashed var(--accent); width: 5px; height: 5px; }
.src-ref { display: inline-flex; align-items: center; gap: 4px; color: var(--edge-source); font-weight: 500; }
.src-ref.none { color: var(--danger); }
.count-ref { color: var(--fg-3); }
.ext-ref { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 500; font-size: 11.5px; border: 1px dashed var(--accent); border-radius: 4px; padding: 0 5px; }

/* Puertos de conexión */
.port {
  position: absolute; width: 12px; height: 12px; border-radius: 50%;
  background: var(--panel); border: 2px solid var(--accent); opacity: 0; transition: opacity .12s, transform .12s;
  cursor: crosshair; z-index: 2; touch-action: none;
}
.port:hover { transform: scale(1.25); background: var(--accent); }
.leaf:hover .port, .leaf.selected .port, .ctr-head:hover > .port, .ctr.selected > .ctr-head > .port, #viewport.connecting .port { opacity: 1; }
.port-t { top: -7px; left: calc(50% - 6px); }
.port-b { bottom: -7px; left: calc(50% - 6px); }
.port-l { left: -8px; top: calc(50% - 6px); }
.port-r { right: -7px; top: calc(50% - 6px); }
.type-ds .port-l, .type-uikit .port-l { left: -9px; }

/* =========================================================
   6. Controles flotantes: zoom, minimapa, leyenda, status, toasts
   ========================================================= */
.float { position: absolute; z-index: 10; }
#zoomBar {
  right: 12px; bottom: 12px; display: flex; align-items: center; gap: 2px; padding: 3px;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow);
}
#zoomBar .zoom-label { min-width: 46px; text-align: center; font-size: 12px; font-variant-numeric: tabular-nums; border-radius: 4px; padding: 4px 2px; }
#zoomBar .zoom-label:hover { background: var(--hover); }
#minimap {
  right: 12px; bottom: 56px; width: 200px; height: 130px; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--panel); box-shadow: var(--shadow); cursor: crosshair; touch-action: none;
}
#statusBar { left: 12px; bottom: 12px; font-size: 12px; color: var(--fg-3); pointer-events: none; display: flex; gap: 10px; }
#legend {
  left: 12px; bottom: 36px; display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11.5px; color: var(--fg-2);
  background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 6px 10px; border-radius: var(--radius); border: 1px solid var(--border); pointer-events: none;
}
#legend span { display: inline-flex; align-items: center; gap: 6px; }
#legend svg { width: 28px; height: 10px; overflow: visible; }
#legend .lg-ds { stroke: var(--accent); stroke-width: 2.2; }
#legend .lg-ext { stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 6 4; }
#legend .lg-src { stroke: var(--edge-source); stroke-width: 1.8; stroke-dasharray: 2 4; stroke-linecap: round; }
#legend .lg-box { width: 14px; height: 10px; border: 1px solid var(--border-strong); border-radius: 3px; display: inline-block; position: relative; }
#legend .lg-box::after { content: ""; position: absolute; left: 3px; top: 3px; width: 5px; height: 4px; border: 1px dashed var(--fg-3); border-radius: 1px; }
#toasts { left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; z-index: 60; }
.toast {
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: var(--radius); font-size: 13px; box-shadow: var(--shadow-md);
  animation: toastIn .18s ease-out; max-width: min(460px, 90vw); pointer-events: auto;
}
.toast.error { background: var(--danger); color: #fff; }
.toast.out { opacity: 0; transition: opacity .25s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* =========================================================
   7. Popover / menús contextuales
   ========================================================= */
#popover {
  position: fixed; z-index: 70; min-width: 190px; max-width: 340px; padding: 4px;
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  animation: popIn .12s ease-out;
}
@keyframes popIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }
.menu-item {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border-radius: var(--radius);
  text-align: left; font-size: 13px; color: var(--fg);
}
.menu-item:hover { background: var(--hover); }
.menu-item .ico { width: 18px; text-align: center; color: var(--fg-2); flex: none; }
.menu-item kbd { margin-left: auto; }
.menu-item.danger { color: var(--danger); }
.menu-item.danger:hover { background: var(--danger-soft); }
.menu-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-3); padding: 6px 8px 2px; }
.menu-note { font-size: 12px; color: var(--fg-2); padding: 4px 8px 6px; line-height: 1.4; }
.menu-field { padding: 4px 8px 6px; }
.menu-field label { font-size: 11px; color: var(--fg-3); display: block; margin-bottom: 3px; }
.color-grid { display: grid; grid-template-columns: repeat(5, 24px); gap: 6px; padding: 8px; }
.color-grid button { width: 24px; height: 24px; border-radius: 6px; border: 2px solid transparent; }
.color-grid button.active { border-color: var(--fg); }

/* =========================================================
   8. Panel de administración (drawer)
   ========================================================= */
.panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 100vw; z-index: 40;
  background: var(--panel); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; transform: translateX(100%); transition: transform .22s ease;
}
.panel.open { transform: none; }
.panel header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 8px; }
.panel h2 { margin: 0; font-size: 16px; font-weight: 600; }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tabs button { padding: 7px 10px; font-size: 13px; color: var(--fg-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button:hover { color: var(--fg); background: var(--hover); border-radius: 4px 4px 0 0; }
.tabs button.active { color: var(--fg); border-bottom-color: var(--fg); font-weight: 500; }
.panel-body { flex: 1; overflow-y: auto; padding: 14px 16px 24px; }
.panel-body h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--fg-3); margin: 18px 0 8px; font-weight: 600; }
.panel-body h3:first-child { margin-top: 0; }
.panel-body p { color: var(--fg-2); font-size: 13px; line-height: 1.5; margin: 6px 0 10px; }
.row { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.row .grow { flex: 1; min-width: 0; }
.row .count { font-size: 12px; color: var(--fg-3); white-space: nowrap; }
.row input.inline { padding: 4px 6px; border-color: transparent; background: transparent; }
.row input.inline:hover { border-color: var(--border); }
.row input.inline:focus { border-color: var(--accent); background: var(--bg); }
.row select { width: auto; padding: 4px 6px; }
.swatch { width: 22px; height: 22px; border-radius: 6px; flex: none; border: 1px solid rgba(0,0,0,.06); }
.inline-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.toggle-row:last-child { border-bottom: 0; }
.toggle-row .label { font-size: 13.5px; }
.toggle-row .hint { font-size: 12px; color: var(--fg-3); margin-top: 2px; }
.switch { position: relative; width: 36px; height: 20px; border-radius: 10px; background: var(--border); transition: background .2s; flex: none; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); box-shadow: var(--shadow); transition: transform .2s; }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(16px); }
.empty { color: var(--fg-3); font-size: 13px; padding: 10px 0; }

/* =========================================================
   9. Diálogos
   ========================================================= */
dialog {
  border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0; color: var(--fg);
  background: var(--panel); box-shadow: var(--shadow-lg); width: min(540px, calc(100vw - 32px)); max-height: calc(100dvh - 32px);
}
dialog::backdrop { background: rgba(15, 15, 15, 0.45); }
dialog form, dialog .dialog-inner { display: flex; flex-direction: column; max-height: calc(100dvh - 34px); }
dialog header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 6px; }
dialog h2 { margin: 0; font-size: 16px; font-weight: 600; }
dialog .dialog-body { padding: 8px 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
dialog footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; flex-wrap: wrap; }
dialog footer .left { margin-right: auto; }
.field label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 500; color: var(--fg-2); margin-bottom: 4px; }
.field .hint { font-size: 11.5px; color: var(--fg-3); margin-top: 4px; }
.field .error { font-size: 12px; color: var(--danger); margin-top: 4px; }
.field.invalid input, .field.invalid select { border-color: var(--danger); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.counter { font-weight: 400; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.counter.over { color: var(--danger); }
.type-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.type-picker button {
  padding: 10px 8px; border: 1px solid var(--border); border-radius: var(--radius); text-align: left; background: var(--bg);
  display: flex; flex-direction: column; gap: 3px;
}
.type-picker button:hover { background: var(--hover); }
.type-picker button.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.type-picker .t { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.type-picker .d { font-size: 11.5px; color: var(--fg-3); line-height: 1.3; }
.type-picker .dot { width: 9px; height: 9px; border-radius: 2px; }
.chips-select { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips-select .chip { cursor: pointer; opacity: .55; border: 1px solid transparent; padding: 1px 8px; line-height: 20px; }
.chips-select .chip.on { opacity: 1; border-color: var(--fg); }
.chips-select .add-tag input { width: 130px; padding: 2px 6px; font-size: 12px; }
.check-list { display: flex; flex-direction: column; gap: 2px; max-height: 180px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); padding: 4px; }
.check-list label { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; font-size: 13px; cursor: pointer; }
.check-list label:hover { background: var(--hover); }
.check-list .t-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.check-list .where { color: var(--fg-3); font-size: 11.5px; margin-left: auto; }
.img-field { display: flex; gap: 12px; align-items: flex-start; }
.img-preview { width: 160px; height: 90px; border-radius: var(--radius); background: var(--hover); border: 1px dashed var(--border); display: grid; place-items: center; color: var(--fg-3); font-size: 12px; overflow: hidden; flex: none; }
.img-preview img { width: 100%; height: 100%; object-fit: cover; }
.img-actions { display: flex; flex-direction: column; gap: 6px; }
.shortcuts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; font-size: 13px; }
.shortcuts .sc { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.shortcuts .sc span:last-child { display: flex; gap: 4px; }
.shortcuts h4 { grid-column: 1 / -1; margin: 10px 0 2px; font-size: 12px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .04em; }
.confirm-msg { font-size: 13.5px; line-height: 1.5; color: var(--fg-2); white-space: pre-line; }

/* =========================================================
   10. Responsivo
   ========================================================= */
@media (max-width: 720px) {
  .topbar { padding: 6px 8px; gap: 6px; }
  .topbar .hide-sm, .save-status, .topbar .brand span { display: none; }
  .panel { width: 100%; border-left: 0; }
  #minimap, #legend { display: none !important; }
  .shortcuts { grid-template-columns: 1fr; }
  .type-picker, .field-row { grid-template-columns: 1fr; }
  .img-field { flex-direction: column; }
}
</style>
</head>

<script>
'use strict';
/* =========================================================
   1. Utilidades y constantes
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const MOD = isMac ? '⌘' : 'Ctrl';

const STORAGE_KEY = 'systree:v2';
const LEGACY_KEY = 'systree:v1';
const CARD_W = 220;          // ancho fijo de card hoja (DS / UI Kit)
const CTR_MIN_W = 300;       // ancho mínimo de contenedor
const CTR_MIN_BODY = 96;     // alto mínimo del cuerpo de un contenedor
const PAD = 16;              // margen interno de los contenedores
const HEAD_GAP = 12;         // espacio entre cabecera y primer hijo
const GAP = 24;              // separación en auto-layout
const GRID = 8;              // cuadrícula de ajuste
const SNAP_DIST = 6;         // magnetismo de guías (px pantalla)
const DRAG_THRESHOLD = 4;    // px antes de iniciar arrastre
const MIN_Z = 0.1, MAX_Z = 4;
const HISTORY_MAX = 60;

const TYPE_META = {
  software: { label: 'Software', desc: 'Contenedor: app, módulo o feature', color: 'var(--c-software)' },
  ds:       { label: 'Design System', desc: 'Vive dentro de un software', color: 'var(--c-ds)' },
  uikit:    { label: 'UI Kit', desc: 'Derivado de una fuente; vive dentro de un software', color: 'var(--c-uikit)' },
};
const TAG_COLORS = ['gray', 'brown', 'orange', 'yellow', 'green', 'blue', 'purple', 'pink', 'red'];
const KIND_LABEL = { ds: 'Dependencia de sistema de diseño', source: 'Fuente de UI Kit' };

/* =========================================================
   2. Modelo de datos y persistencia
   ---------------------------------------------------------
   state = {
     nodes: [{ id, type:'software'|'ds'|'uikit', name, description, image, tags:[tagId], owner,
               parentId,        // software contenedor (null = raíz / maestro). Obligatorio para ds y uikit
               branchTypeId,    // tipo de ramificación (solo software anidado)
               x, y,            // posición LOCAL respecto al contenedor padre (mundo si es raíz)
               w, h,            // tamaño mínimo manual del contenedor (0 = automático)
               demo }]
     edges: [{ id, kind:'ds'|'source', from, to, demo }]
             ds:     from = software, to = DS/UI Kit que usa. Si viven en raíces distintas se dibuja discontinua
             source: from = UI Kit, to = fuente (DS o software) de la que deriva
     tags:      [{ id, name, color }]
     edgeTypes: [{ id, name, color }]     // tipos de ramificación (anidamiento)
     settings:  { theme, snap, minimap, grid, tool }
     camera:    { x, y, z }
   }
   La ramificación padre → hijo ya no es una línea: es el anidamiento del contenedor.
   ========================================================= */
function defaultState() {
  return {
    version: 2,
    nodes: [],
    edges: [],
    tags: [
      { id: 't_core', name: 'Core', color: 'blue' },
      { id: 't_web', name: 'Web', color: 'purple' },
      { id: 't_mobile', name: 'Mobile', color: 'green' },
      { id: 't_legacy', name: 'Legacy', color: 'brown' },
      { id: 't_interno', name: 'Interno', color: 'gray' },
      { id: 't_pagos', name: 'Pagos', color: 'yellow' },
    ],
    edgeTypes: [
      { id: 'et_feature', name: 'Feature', color: 'blue' },
      { id: 'et_fork', name: 'Fork', color: 'gray' },
      { id: 'et_mobile', name: 'Versión mobile', color: 'green' },
      { id: 'et_desktop', name: 'Versión desktop', color: 'purple' },
      { id: 'et_geo', name: 'Geografía/Región', color: 'orange' },
      { id: 'et_parent', name: 'Software padre/hijo', color: 'brown' },
    ],
    settings: { theme: null, snap: true, minimap: true, grid: true, tool: 'select' },
    camera: { x: 80, y: 60, z: 0.9 },
  };
}

/** Datos de ejemplo (demo:true). Las posiciones las define el auto-layout en la primera carga. */
function demoData() {
  const N = (id, type, name, description, parentId, branchTypeId, tags, owner) =>
    ({ id, type, name, description, image: null, tags, owner, parentId, branchTypeId, x: 0, y: 0, w: 0, h: 0, demo: true });
  const nodes = [
    // Raíz 1: Portal Web, con su propio DS (Nova), una feature (Checkout) que creó su propio DS, y una variante regional
    N('d_portal', 'software', 'Portal Web', 'Sitio público principal de la organización.', null, null, ['t_web', 't_core'], '@mariana'),
    N('d_nova', 'ds', 'Nova DS', 'Sistema de diseño principal: tokens, componentes y guías.', 'd_portal', null, ['t_core'], '@ana'),
    N('d_checkout', 'software', 'Checkout', 'Flujo de pago y confirmación de pedidos.', 'd_portal', 'et_feature', ['t_web', 't_pagos'], '@mariana'),
    N('d_checkds', 'ds', 'Checkout DS', 'DS nacido dentro de Checkout para componentes de pago.', 'd_checkout', null, ['t_pagos'], '@lucia'),
    N('d_gt', 'software', 'Portal Web Guatemala', 'Variante regional con catálogo y moneda locales.', 'd_portal', 'et_geo', ['t_web'], '@jorge'),
    // Raíz 2: App Móvil con un UI Kit derivado de Nova
    N('d_app', 'software', 'App Móvil', 'App nativa para iOS y Android.', null, null, ['t_mobile', 't_core'], '@sofia'),
    N('d_novakit', 'uikit', 'Nova Mobile Kit', 'Kit de UI para iOS/Android derivado de Nova DS.', 'd_app', null, ['t_mobile'], '@ana'),
    // Raíz 3: aplicativo nuevo que adoptó el DS creado en la feature Checkout
    N('d_pagos', 'software', 'Pagos Empresariales', 'Nuevo aplicativo B2B que adoptó Checkout DS como su sistema de diseño.', null, null, ['t_pagos'], '@raul'),
    // Raíz 4: Backoffice con su DS legacy
    N('d_backoffice', 'software', 'Backoffice Admin', 'Panel interno de operación y soporte.', null, null, ['t_interno', 't_legacy'], '@raul'),
    N('d_atlas', 'ds', 'Atlas DS (legacy)', 'Sistema de diseño heredado, en proceso de retiro.', 'd_backoffice', null, ['t_legacy'], '@raul'),
  ];
  const E = (id, kind, from, to) => ({ id, kind, from, to, demo: true });
  const edges = [
    E('de1', 'ds', 'd_portal', 'd_nova'),          // interna (misma raíz)
    E('de2', 'ds', 'd_gt', 'd_nova'),              // interna
    E('de3', 'ds', 'd_checkout', 'd_checkds'),     // interna
    E('de4', 'ds', 'd_app', 'd_novakit'),          // interna
    E('de5', 'source', 'd_novakit', 'd_nova'),     // UI Kit deriva de (punteada)
    E('de6', 'ds', 'd_pagos', 'd_checkds'),        // EXTERNA: otro aplicativo consume el DS nacido en una feature (discontinua)
    E('de7', 'ds', 'd_backoffice', 'd_atlas'),     // interna
  ];
  return { nodes, edges };
}

/** Sanea un estado importado o leído de localStorage; migra el formato v1 (ramificaciones como líneas). */
function normalizeState(raw) {
  const d = defaultState();
  const s = { ...d, ...(raw && typeof raw === 'object' ? raw : {}) };
  s.version = 2;
  s.nodes = Array.isArray(s.nodes) ? s.nodes.filter(n => n && n.id).map(n => ({
    id: String(n.id), type: TYPE_META[n.type] ? n.type : 'software', name: String(n.name ?? 'Sin nombre'),
    description: String(n.description ?? '').slice(0, 140), image: typeof n.image === 'string' && n.image.startsWith('data:image') ? n.image : null,
    tags: Array.isArray(n.tags) ? n.tags.map(String) : [], owner: String(n.owner ?? ''),
    parentId: n.parentId ? String(n.parentId) : null, branchTypeId: n.branchTypeId ? String(n.branchTypeId) : null,

/* --- Guías inteligentes: alineación y distancia respecto a los hermanos --- */
function computeGuides(id, nx, ny, exclude) {
  const n = nodeById(id);
  const s = sizes.get(id) || { w: CARD_W, h: 120 };
  const off = n.parentId ? worldPos(nodeById(n.parentId)) : { x: 0, y: 0 };
  const me = { x: off.x + nx, y: off.y + ny, w: s.w, h: s.h };
  const th = SNAP_DIST / cam.z;
  let bestX = null, bestY = null;
  const others = state.nodes.filter(o => (o.parentId || null) === (n.parentId || null) && !exclude.has(o.id)).map(nodeRect);
  for (const o of others) {
    const xs = [[me.x, o.x], [me.x + me.w / 2, o.cx], [me.x + me.w, o.x + o.w], [me.x, o.x + o.w], [me.x + me.w, o.x]];
    const ys = [[me.y, o.y], [me.y + me.h / 2, o.cy], [me.y + me.h, o.y + o.h], [me.y, o.y + o.h], [me.y + me.h, o.y]];
    for (const [mine, theirs] of xs) { const d = theirs - mine; if (Math.abs(d) <= th && (!bestX || Math.abs(d) < Math.abs(bestX.d))) bestX = { d, line: theirs, o }; }
    for (const [mine, theirs] of ys) { const d = theirs - mine; if (Math.abs(d) <= th && (!bestY || Math.abs(d) < Math.abs(bestY.d))) bestY = { d, line: theirs, o }; }
  }
  const lines = [];
  if (bestX) { me.x += bestX.d; lines.push({ type: 'v', x: bestX.line, y1: Math.min(me.y, bestX.o.y), y2: Math.max(me.y + me.h, bestX.o.y + bestX.o.h) }); }
  if (bestY) { me.y += bestY.d; lines.push({ type: 'h', y: bestY.line, x1: Math.min(me.x, bestY.o.x), x2: Math.max(me.x + me.w, bestY.o.x + bestY.o.w) }); }
  let near = null;
  for (const o of others) {
    const overlapV = Math.min(me.y + me.h, o.y + o.h) - Math.max(me.y, o.y);
    if (overlapV > 10) {
      const gap = o.x >= me.x + me.w ? o.x - (me.x + me.w) : me.x >= o.x + o.w ? me.x - (o.x + o.w) : -1;
      if (gap >= 0 && gap < 400 && (!near || gap < near.gap)) near = { gap, type: 'h', y: Math.max(me.y, o.y) + overlapV / 2, x1: o.x >= me.x ? me.x + me.w : o.x + o.w, x2: o.x >= me.x ? o.x : me.x };
    }
    const overlapH = Math.min(me.x + me.w, o.x + o.w) - Math.max(me.x, o.x);
    if (overlapH > 10) {
      const gap = o.y >= me.y + me.h ? o.y - (me.y + me.h) : me.y >= o.y + o.h ? me.y - (o.y + o.h) : -1;
      if (gap >= 0 && gap < 400 && (!near || gap < near.gap)) near = { gap, type: 'v', x: Math.max(me.x, o.x) + overlapH / 2, y1: o.y >= me.y ? me.y + me.h : o.y + o.h, y2: o.y >= me.y ? o.y : me.y };
    }
  }
  if (near && (bestX || bestY)) lines.push({ ...near, gapLabel: Math.round(near.gap) });
  return { x: me.x - off.x, y: me.y - off.y, lines };
}
function drawGuides(lines) {
  if (!lines.length) { guidesSvg.innerHTML = ''; return; }
  let html = '';

    if (l.gapLabel !== undefined) {
      if (l.type === 'h') { const a = toScreen(l.x1, l.y), b = toScreen(l.x2, l.y); html += `<line class="gap" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><text x="${(a.x + b.x) / 2}" y="${a.y - 5}">${l.gapLabel}</text>`; }
      else { const a = toScreen(l.x, l.y1), b = toScreen(l.x, l.y2); html += `<line class="gap" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/><text x="${a.x + 14}" y="${(a.y + b.y) / 2 + 3}">${l.gapLabel}</text>`; }
    } else if (l.type === 'v') { const a = toScreen(l.x, l.y1 - 20), b = toScreen(l.x, l.y2 + 20); html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`; }
    else { const a = toScreen(l.x1 - 20, l.y), b = toScreen(l.x2 + 20, l.y); html += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`; }

document.addEventListener('keydown', e => {

  const dialogOpen = !!$('dialog[open]');
  if (e.key === 'Alt') altDown = true;

    if (ptr) { cancelGesture(); return; }
    if ($('#adminPanel').classList.contains('open')) { toggleAdmin(false); return; }
    clearSelection(); return;
  }
  if (typing || dialogOpen) return;
  const mod = e.metaKey || e.ctrlKey;
  const key = e.key.toLowerCase();
  if (e.code === 'Space') { if (!spaceDown) { spaceDown = true; viewport.classList.add('space-pan'); } e.preventDefault(); return; }
  if (mod && key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && key === 'y') { e.preventDefault(); redo(); return; }
  if (mod && key === 'd') { e.preventDefault(); duplicateSelection(); return; }
  if (mod && key === 'a') { e.preventDefault(); selectAll(); return; }
  if (mod && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomStep(1.2); return; }
  if (mod && e.key === '-') { e.preventDefault(); zoomStep(1 / 1.2); return; }
  if (mod && e.key === '0') { e.preventDefault(); setZoom(1); return; }
  if (mod) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelection(); return; }
  if (e.key.startsWith('Arrow')) {
    e.preventDefault();
    const s = e.shiftKey ? 10 : 1;
    nudge(e.key === 'ArrowLeft' ? -s : e.key === 'ArrowRight' ? s : 0, e.key === 'ArrowUp' ? -s : e.key === 'ArrowDown' ? s : 0);
    return;
  }
  if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }
  if (e.shiftKey && e.code === 'Digit1') { e.preventDefault(); fitToScreen(); return; }
  if (e.shiftKey && e.code === 'Digit2') { e.preventDefault(); fitToScreen([...sel.nodes]); return; }
  if (e.key === '=' || e.key === '+') { zoomStep(1.2); return; }
  if (e.key === '-') { zoomStep(1 / 1.2); return; }
  if (key === 'v') { setTool('select'); return; }
  if (key === 'h') { setTool('hand'); return; }
  if (key === 'n') { const r = $('#btnNew').getBoundingClientRect(); showNewMenu(r.left, r.bottom + 4); return; }
  if (key === 'e' || e.key === 'Enter') { if (sel.nodes.size === 1) { e.preventDefault(); openEditor([...sel.nodes][0]); } return; }
});

/** ¿Agregar la arista `kind` from→to crearía un ciclo? */

const canNest = (childId, parentId) => childId !== parentId && isContainer(nodeById(parentId)) && !isAncestor(childId, parentId) && nodeById(childId).parentId !== parentId;

    if (canNest(b.id, a.id)) opts.push({ kind: 'nest', child: b.id, parent: a.id, label: `Anidar ${b.name} dentro de ${a.name}` });
    if (canNest(a.id, b.id)) opts.push({ kind: 'nest', child: a.id, parent: b.id, label: `Anidar ${a.name} dentro de ${b.name}` });
  }
  if (a.type === 'software' && dsish(b.type)) opts.push({ kind: 'ds', from: a.id, to: b.id, label: `${a.name} usa ${b.name}` });
  if (dsish(a.type) && b.type === 'software') opts.push({ kind: 'ds', from: b.id, to: a.id, label: `${b.name} usa ${a.name}` });
  if (a.type === 'uikit') opts.push({ kind: 'source', from: a.id, to: b.id, label: `${a.name} deriva de ${b.name} (fuente)` });
  if (b.type === 'uikit') opts.push({ kind: 'source', from: b.id, to: a.id, label: `${b.name} deriva de ${a.name} (fuente)` });

}

  if (opts.length === 1 && opts[0].kind !== 'nest') return addEdge(opts[0]);
  openPopover(x, y, el => {
    el.innerHTML = '<div class="menu-title">¿Qué relación creamos?</div>';
    let typeSel = null;
    if (opts.some(o => o.kind === 'nest')) {
      const f = document.createElement('div'); f.className = 'menu-field';
      f.innerHTML = `<label>Tipo de ramificación (al anidar)</label><select>${state.edgeTypes.map(t => `<option value="${t.id}" ${t.id === defaultBranchType() ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</select>`;
      typeSel = f.querySelector('select'); el.appendChild(f);
    }
    for (const o of opts) {

/** Anida un software dentro de otro, colocándolo en un hueco libre. */
function nestNode(childId, parentId, typeId) {

  if (kind === 'source' && wouldCycle(kind, from, to)) { toast('No se permite: crearía un ciclo de fuentes', 'error'); return false; }

function processImage(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('El archivo no es una imagen'));
    if (file.size > 10 * 1024 * 1024) return reject(new Error('Imagen demasiado grande (máx. 10 MB)'));
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const W = 320, H = 180, c = document.createElement('canvas'); c.width = W; c.height = H;
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
      const s = Math.max(W / img.width, H / img.height), dw = img.width * s, dh = img.height * s;
      ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
      let q = .85, out = c.toDataURL('image/jpeg', q);
      while (out.length > 100 * 1024 && q > .3) { q -= .1; out = c.toDataURL('image/jpeg', q); }
      resolve(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('No se pudo leer la imagen')); };
    img.src = url;
  });
}

/* =========================================================
   15. Eliminar y duplicar
   ========================================================= */
async function deleteNodes(ids) {
  ids = ids.filter(nodeById); if (!ids.length) return;
  const set = new Set(ids);
  const inside = new Set(); ids.forEach(id => descendantsOf(id).forEach(d => { if (!set.has(d)) inside.add(d); }));
  const all = new Set([...set, ...inside]);
  const connected = state.edges.filter(e => all.has(e.from) || all.has(e.to));
  const orphanKits = state.nodes.filter(n => n.type === 'uikit' && !all.has(n.id) && state.edges.some(e => e.kind === 'source' && e.from === n.id && all.has(e.to)));
  // Opción de conservar el contenido: solo con una card, si tiene hijos y estos pueden vivir en el nuevo lugar
  let keep = null;
  if (ids.length === 1) {
    const n = nodeById(ids[0]); const kids = childrenOf(n.id);
    if (kids.length && (n.parentId || kids.every(isContainer))) keep = { node: n, kids };
  }
  const names = ids.length === 1 ? `"${nodeById(ids[0]).name}"` : `${ids.length} cards`;
  let message = `Vas a eliminar ${names}.`;
  if (inside.size) message += `\nContiene ${inside.size} elemento${inside.size > 1 ? 's' : ''} (features, DS o UI Kits).`;
  message += connected.length ? `\nHay ${connected.length} ${connected.length > 1 ? 'conexiones' : 'conexión'} involucrada${connected.length > 1 ? 's' : ''}.` : '\nNo hay conexiones involucradas.';
  if (keep) message += `\nPuedes conservar su contenido moviéndolo a ${keep.node.parentId ? `"${parentOf(keep.node).name}"` : 'la raíz'}.`;
  if (orphanKits.length) message += `\n⚠ ${orphanKits.length} UI Kit${orphanKits.length > 1 ? 's' : ''} (${orphanKits.map(k => k.name).join(', ')}) quedará${orphanKits.length > 1 ? 'n' : ''} sin fuente.`;
  const buttons = [{ label: 'Cancelar', value: '' }];
  if (keep) buttons.push({ label: 'Eliminar y conservar contenido', value: 'keep' });
  buttons.push({ label: inside.size ? 'Eliminar con todo su contenido' : connected.length ? 'Eliminar con sus conexiones' : 'Eliminar', value: 'all', kind: 'danger' });
  const choice = await confirmBox({ title: 'Eliminar card', message, buttons });
  if (!choice) return;
  pushHistory();
  let toDelete = all;
  if (choice === 'keep') {
    const n = keep.node; const newParent = n.parentId || null; const base = newParent ? worldPos(nodeById(newParent)) : { x: 0, y: 0 };
    for (const k of keep.kids) { const w = worldPos(k); k.parentId = newParent; k.x = w.x - base.x; k.y = w.y - base.y; if (!newParent) k.branchTypeId = null; else clampInside(k); }
    toDelete = set;
  }
  state.nodes = state.nodes.filter(n => !toDelete.has(n.id));
  state.edges = state.edges.filter(e => !toDelete.has(e.from) && !toDelete.has(e.to));
  toDelete.forEach(id => sel.nodes.delete(id));
  renderAll(); save();
  toast(`${names.replace(/"/g, '')} eliminad${ids.length === 1 ? 'a' : 'as'}`);
}
function deleteSelection() {
  if (sel.edge) return deleteEdge(sel.edge);
  if (sel.nodes.size) deleteNodes(topLevelSelection());
}
function duplicateSelection() {
  const tops = topLevelSelection(); if (!tops.length) return;
  pushHistory();
  const map = new Map(); const copies = [];
  const cloneTree = (n, parentId) => {
    const c = { ...n, id: uid(), tags: [...n.tags], parentId, demo: false }; map.set(n.id, c.id); copies.push(c);
    childrenOf(n.id).forEach(k => cloneTree(k, c.id));
  };
  for (const id of tops) { const n = nodeById(id); cloneTree(n, n.parentId || null); const c = copies.find(x => x.id === map.get(id)); c.x += 24; c.y += 24; }
  state.nodes.push(...copies);
  for (const e of [...state.edges]) {
    const f = map.get(e.from), t = map.get(e.to);
    if (f && t) state.edges.push({ ...e, id: uid(), from: f, to: t, demo: false });
    else if (f) state.edges.push({ ...e, id: uid(), from: f, demo: false });
  }
  sel.nodes = new Set(tops.map(id => map.get(id))); sel.edge = null;
  renderAll(); save();
  toast(`${copies.length} card${copies.length > 1 ? 's' : ''} duplicada${copies.length > 1 ? 's' : ''}`);
}

  if (!state.tags.length) rows.innerHTML = '<div class="empty">No hay etiquetas.</div>';
  for (const t of state.tags) {
    const row = document.createElement('div'); row.className = 'row';
    const u = usage(t.id);
    row.innerHTML = `<button class="swatch tag-${t.color}" title="Cambiar color"></button><input class="inline grow" value="${esc(t.name)}"><span class="count">${u} card${u === 1 ? '' : 's'}</span><button class="icon-btn" title="Eliminar">🗑</button>`;
    const [sw, inp, , del] = row.children;
    sw.addEventListener('click', e => colorPicker(e.clientX, e.clientY, t.color, c => { pushHistory(); t.color = c; renderAll(); save(); }));
    inp.addEventListener('change', () => { const v = inp.value.trim(); if (!v) { inp.value = t.name; return; } pushHistory(); t.name = v; renderAll(); save(); });
    del.addEventListener('click', async () => {
      if (u && !(await confirmBox({ title: 'Eliminar etiqueta', message: `"${t.name}" se usa en ${u} card${u > 1 ? 's' : ''}. Se quitará de todas.`, buttons: [{ label: 'Cancelar', value: '' }, { label: 'Eliminar', value: 'ok', kind: 'danger' }] }))) return;
      pushHistory(); state.tags = state.tags.filter(x => x !== t); state.nodes.forEach(n => n.tags = n.tags.filter(x => x !== t.id)); renderAll(); save();
    });
    rows.appendChild(row);
  }
  $('#newTagForm', body).addEventListener('submit', e => {
    e.preventDefault(); const name = e.target.querySelector('input').value.trim(); if (!name) return;
    pushHistory(); state.tags.push({ id: uid(), name, color: TAG_COLORS[state.tags.length % TAG_COLORS.length] }); save(); renderAdmin();
  });
}

/* --- Tipos de ramificación --- */
function renderEdgeTypesTab(body) {
  const usage = id => state.nodes.filter(n => n.parentId && n.branchTypeId === id).length;
  body.innerHTML = `<h3>Tipos de ramificación (${state.edgeTypes.length})</h3><p>La ramificación es el anidamiento de un software dentro de otro. El tipo se muestra como chip en la cabecera del contenedor anidado.</p><div id="etRows"></div>
    <h3>Nuevo tipo</h3><form class="row" id="newEtForm"><input class="grow" placeholder="Nombre del tipo" required><button class="btn primary" type="submit">Agregar</button></form>`;
  const rows = $('#etRows', body);
  for (const t of state.edgeTypes) {
    const row = document.createElement('div'); row.className = 'row';
    const u = usage(t.id);
    row.innerHTML = `<button class="swatch tag-${t.color}" title="Cambiar color"></button><input class="inline grow" value="${esc(t.name)}"><span class="count">${u} anidado${u === 1 ? '' : 's'}</span><button class="icon-btn" title="Eliminar">🗑</button>`;
    const [sw, inp, , del] = row.children;
    sw.addEventListener('click', e => colorPicker(e.clientX, e.clientY, t.color, c => { pushHistory(); t.color = c; renderAll(); save(); }));
    inp.addEventListener('change', () => { const v = inp.value.trim(); if (!v) { inp.value = t.name; return; } pushHistory(); t.name = v; renderAll(); save(); });
    del.addEventListener('click', async () => {
      if (state.edgeTypes.length === 1) return toast('Debe existir al menos un tipo', 'error');
      const fallback = state.edgeTypes.find(x => x !== t);
      if (u && !(await confirmBox({ title: 'Eliminar tipo', message: `"${t.name}" se usa en ${u} software anidado${u > 1 ? 's' : ''}. Pasarán a "${fallback.name}".`, buttons: [{ label: 'Cancelar', value: '' }, { label: 'Eliminar', value: 'ok', kind: 'danger' }] }))) return;
      pushHistory(); state.nodes.forEach(n => { if (n.branchTypeId === t.id) n.branchTypeId = fallback.id; }); state.edgeTypes = state.edgeTypes.filter(x => x !== t); renderAll(); save();
    });
    rows.appendChild(row);
  }
  $('#newEtForm', body).addEventListener('submit', e => {
    e.preventDefault(); const name = e.target.querySelector('input').value.trim(); if (!name) return;
    pushHistory(); state.edgeTypes.push({ id: uid(), name, color: TAG_COLORS[state.edgeTypes.length % TAG_COLORS.length] }); save(); renderAdmin();
  });
}

/* --- Responsables --- */
function renderOwnersTab(body) {
  const map = new Map();
  for (const n of state.nodes) if (n.owner) map.set(n.owner, (map.get(n.owner) || 0) + 1);
  const owners = [...map.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  body.innerHTML = `<h3>Responsables detectados (${owners.length})</h3><p>Se detectan a partir del campo @ de cada card. Renombrar reemplaza el valor en todas las cards.</p><div id="ownerRows"></div>`;
  const rows = $('#ownerRows', body);
  if (!owners.length) rows.innerHTML = '<div class="empty">Ninguna card tiene responsable.</div>';
  for (const [owner, count] of owners) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<span class="owner chip tag-gray" style="font-family:var(--mono)">${esc(owner)}</span><span class="grow"></span><span class="count">${count} card${count === 1 ? '' : 's'}</span><button class="btn">Renombrar</button>`;
    row.querySelector('.btn').addEventListener('click', async () => {
      const v = await promptBox({ title: 'Renombrar responsable', label: `Nuevo nombre para ${owner} (${count} cards)`, value: owner, okLabel: 'Renombrar' });
      if (v === null) return; const nv = normalizeOwner(v);
      pushHistory(); state.nodes.forEach(n => { if (n.owner === owner) n.owner = nv; }); renderAll(); save();
      toast(nv ? `Renombrado a ${nv}` : 'Responsable eliminado de las cards');
    });
    rows.appendChild(row);
  }
}

/* --- Datos --- */
function renderDataTab(body) {
  const bytes = JSON.stringify(state).length;
  const demoCount = state.nodes.filter(n => n.demo).length;
  body.innerHTML = `<h3>Respaldo</h3><p>localStorage es frágil (se borra al limpiar el navegador). Exporta un JSON periódicamente. Importar reemplaza todo el estado actual.</p>
    <div class="inline-actions"><button class="btn primary" id="btnExport">⤓ Exportar JSON</button><button class="btn" id="btnCopy">Copiar JSON</button><button class="btn" id="btnImport">⤒ Importar JSON</button></div>
    <p style="margin-top:10px">Tamaño actual: <b>${(bytes / 1024).toFixed(1)} KB</b> · ${roots().length} raíces · ${state.nodes.length} cards · ${state.edges.length} conexiones · ${state.nodes.filter(n => n.image).length} con imagen.</p>
    <h3>Datos de ejemplo</h3><p>${demoCount ? `Hay ${demoCount} cards de ejemplo en el lienzo.` : 'No hay cards de ejemplo cargadas.'}</p>
    <div class="inline-actions"><button class="btn" id="btnLoadDemo">Cargar ejemplos</button><button class="btn danger" id="btnClearDemo" ${demoCount ? '' : 'disabled'}>Borrar ejemplos</button></div>
    <h3>Zona de peligro</h3><p>Elimina todas las cards, conexiones, etiquetas y tipos, y restaura los valores iniciales.</p>
    <button class="btn danger" id="btnClearAll">Borrar todo</button>`;
  $('#btnExport', body).addEventListener('click', exportJSON);
  $('#btnCopy', body).addEventListener('click', async () => { try { await navigator.clipboard.writeText(exportString()); toast('JSON copiado al portapapeles'); } catch { toast('No se pudo copiar', 'error'); } });
  $('#btnImport', body).addEventListener('click', () => $('#importFile').click());
  $('#btnLoadDemo', body).addEventListener('click', () => {
    pushHistory(); removeDemo(); const d = demoData();
    const bb = nodesBBox(); const offX = bb ? bb.x + bb.w + 120 : 0;
    state.nodes.push(...d.nodes); state.edges.push(...d.edges);
    renderAll();
    const target = computeLayout(d.nodes.filter(n => !n.parentId).map(n => n.id));
    for (const [id, p] of target) { const n = nodeById(id); n.x = p.x + (n.parentId ? 0 : offX); n.y = p.y; }
    renderAll(); save(); fitToScreen(); toast('Ejemplos cargados');
  });
  $('#btnClearDemo', body).addEventListener('click', () => { pushHistory(); removeDemo(); renderAll(); save(); toast('Ejemplos eliminados'); });
  $('#btnClearAll', body).addEventListener('click', async () => {
    const ok = await confirmBox({ title: 'Borrar todo', message: 'Se eliminarán todas las cards, conexiones, etiquetas y tipos de ramificación. Esta acción se puede deshacer con Ctrl/⌘+Z mientras no recargues la página.', buttons: [{ label: 'Cancelar', value: '' }, { label: 'Borrar todo', value: 'ok', kind: 'danger' }] });
    if (!ok) return;
    pushHistory(); const d = defaultState(); state.nodes = []; state.edges = []; state.tags = d.tags; state.edgeTypes = d.edgeTypes; clearSelection(); renderAll(); save(); toast('Todo borrado');
  });
}
function removeDemo() {
  const demoIds = new Set(state.nodes.filter(n => n.demo).map(n => n.id));
  // Lo que viva dentro de un contenedor demo también se va (no puede quedar huérfano)
  for (const id of [...demoIds]) descendantsOf(id).forEach(d => demoIds.add(d));
  state.nodes = state.nodes.filter(n => !demoIds.has(n.id));
  state.edges = state.edges.filter(e => !demoIds.has(e.from) && !demoIds.has(e.to));
  demoIds.forEach(id => sel.nodes.delete(id));
}
function exportString() { state.camera = { ...cam }; return JSON.stringify({ ...state, exportedAt: new Date().toISOString() }, null, 2); }
function exportJSON() {
  const blob = new Blob([exportString()], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `arbol-sistemas-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('JSON exportado');
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.nodes) || !Array.isArray(data.edges)) throw new Error('El archivo no tiene el formato esperado (nodes/edges).');
    const legacy = data.edges.some(e => e && e.kind === 'branch');
    const ok = await confirmBox({ title: 'Importar JSON', message: `El archivo contiene ${data.nodes.length} cards y ${data.edges.length} conexiones.${legacy ? '\nEs un respaldo del formato anterior: las ramificaciones se convertirán en contenedores anidados.' : ''}\nReemplazará el estado actual (puedes deshacerlo).`, buttons: [{ label: 'Cancelar', value: '' }, { label: 'Importar', value: 'ok', kind: 'primary' }] });
    if (!ok) return;
    pushHistory();
    const s = normalizeState(data);
    Object.assign(state, s);
    cam = { ...s.camera };
    clearSelection(); applyTheme(); applySettingsUI(); renderAll(); applyCamera(); save();
    toast('Estado importado');
  } catch (err) { toast('Importación fallida: ' + err.message, 'error', 6000); }
});

/* --- Ajustes --- */
function renderSettingsTab(body) {
  const sw = (key, label, hint) => `<div class="toggle-row"><div><div class="label">${label}</div>${hint ? `<div class="hint">${hint}</div>` : ''}</div><button class="switch ${state.settings[key] ? 'on' : ''}" data-key="${key}" role="switch" aria-checked="${!!state.settings[key]}"></button></div>`;
  body.innerHTML = `<h3>Tema</h3><div class="segmented" id="themeSeg"><button data-t="light">Claro</button><button data-t="dark">Oscuro</button><button data-t="">Sistema</button></div>
    <h3>Lienzo</h3>
    ${sw('snap', 'Ajuste a cuadrícula (8 px)', 'Mantén Alt al arrastrar para desactivarlo temporalmente.')}
    ${sw('grid', 'Fondo de puntos')}
    ${sw('minimap', 'Minimapa')}
    <h3>Cómo funciona</h3><p>Cada software es un contenedor. Arrastra una card dentro de otro contenedor para anidarla (ramificación), o fuera de todos para convertir un software en raíz. Los DS y UI Kits siempre viven dentro de un software. Arrastra desde un puerto de la cabecera para conectar o anidar.</p>
    <p>Rueda / dos dedos: pan · ${MOD} + rueda o pinch: zoom · Espacio + arrastrar, botón central o herramienta Mano (H): pan · Arrastrar en el fondo: selección por recuadro.</p>`;
  $$('#themeSeg button', body).forEach(b => { b.classList.toggle('active', (state.settings.theme || '') === b.dataset.t); b.addEventListener('click', () => { state.settings.theme = b.dataset.t || null; applyTheme(); save(); renderAdmin(); }); });
  body.querySelectorAll('.switch').forEach(b => b.addEventListener('click', () => { state.settings[b.dataset.key] = !state.settings[b.dataset.key]; applySettingsUI(); save(); renderAdmin(); }));
}
function applySettingsUI() {
  viewport.classList.toggle('no-grid', !state.settings.grid);
  drawMinimap();
  setTool(state.settings.tool || 'select');
}

/* =========================================================
   17. Auto-layout jerárquico (recursivo por contenedor, animado y deshacible)
   ---------------------------------------------------------
   Dentro de cada contenedor: primero una fila (con salto) de sub-contenedores,
   debajo una fila de DS y UI Kits. Las raíces se acomodan en filas.
   ========================================================= */
function computeLayout(rootIds) {
  const target = new Map(), tmp = new Map();
  const byName = (a, b) => a.name.localeCompare(b.name);
  const typeOrder = { software: 0, ds: 1, uikit: 2 };
  const layout = n => {
    if (!isContainer(n)) { const s = { w: CARD_W, h: measured.get(n.id) || 120 }; tmp.set(n.id, s); return s; }
    const headH = measured.get(n.id) || 60;
    const kids = childrenOf(n.id).sort((a, b) => typeOrder[a.type] - typeOrder[b.type] || byName(a, b));
    kids.forEach(layout);
    const ctrs = kids.filter(isContainer), leaves = kids.filter(k => !isContainer(k));
    let x = PAD, y = headH + HEAD_GAP, rowH = 0, maxR = 0, bottom = y;
    const MAXW = 1100;
    const place = list => {
      for (const k of list) {
        const s = tmp.get(k.id);
        if (x > PAD && x + s.w > MAXW) { x = PAD; y += rowH + GAP; rowH = 0; }
        target.set(k.id, { x, y }); x += s.w + GAP; rowH = Math.max(rowH, s.h); maxR = Math.max(maxR, x - GAP); bottom = Math.max(bottom, y + s.h);
      }
      if (list.length) { y += rowH + GAP; x = PAD; rowH = 0; }
    };
    place(ctrs); place(leaves);
    const s = { w: Math.max(CTR_MIN_W, maxR + PAD), h: Math.max(headH + CTR_MIN_BODY, kids.length ? bottom + PAD : 0), headH };
    tmp.set(n.id, s); return s;
  };
  const rs = (rootIds ? rootIds.map(nodeById).filter(Boolean) : roots()).sort(byName);
  rs.forEach(layout);
  let x = 0, y = 0, rowH = 0; const MAXW = 2400;
  for (const r of rs) {
    const s = tmp.get(r.id);
    if (x > 0 && x + s.w > MAXW) { x = 0; y += rowH + 100; rowH = 0; }
    target.set(r.id, { x, y }); x += s.w + 100; rowH = Math.max(rowH, s.h);
  }
  return target;
}
function autoLayout() {
  if (!state.nodes.length) return toast('No hay cards que ordenar');
  pushHistory();
  for (const n of state.nodes) { n.w = 0; n.h = 0; } // tamaños manuales se descartan
  const target = computeLayout();
  animateNodesTo(target, () => { save(); fitToScreen(); toast('Auto-layout aplicado (Ctrl/⌘+Z para deshacer)'); });
}
function animateNodesTo(target, done, ms = 450) {
  const start = new Map([...target.keys()].map(id => { const n = nodeById(id); return [id, { x: n.x, y: n.y }]; }));
  const t0 = performance.now(); const ease = t => 1 - Math.pow(1 - t, 3);
  const step = now => {
    const t = ease(clamp((now - t0) / ms, 0, 1));
    for (const [id, to] of target) { const n = nodeById(id), s = start.get(id); if (!n) continue; n.x = s.x + (to.x - s.x) * t; n.y = s.y + (to.y - s.y) * t; }
    computeSizes(); applySizes(); updateNodeTransforms(target.keys()); updateEdgePaths();
    if (t < 1) requestAnimationFrame(step);
    else { for (const [id, to] of target) { const n = nodeById(id); if (n) { n.x = Math.round(to.x); n.y = Math.round(to.y); } } renderAll(); done && done(); }
  };
  requestAnimationFrame(step);
}

/* =========================================================
   18. Tema, toasts, atajos
   ========================================================= */
const mql = window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const dark = state.settings.theme ? state.settings.theme === 'dark' : mql.matches;
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  drawMinimap();
}
mql.addEventListener('change', () => { if (!state.settings.theme) applyTheme(); });
$('#themeSwitch').addEventListener('click', () => {
  const dark = document.documentElement.dataset.theme === 'dark';
  state.settings.theme = dark ? 'light' : 'dark'; applyTheme(); save();
  if (adminPanel.classList.contains('open') && adminTab === 'settings') renderAdmin();
});

function toast(msg, kind = 'info', ms = 2600) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div'); el.className = 'toast ' + kind; el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, ms);
  while (box.children.length > 4) box.firstChild.remove();
}

function openShortcuts() {
  const K = (...ks) => ks.map(k => `<kbd>${esc(k)}</kbd>`).join('');
  const row = (l, ...ks) => `<div class="sc"><span>${l}</span><span>${K(...ks)}</span></div>`;
  $('#shortcutsDialog').innerHTML = `<div class="dialog-inner"><header><h2>Atajos de teclado</h2><button class="icon-btn" id="closeSc">✕</button></header>
    <div class="dialog-body"><div class="shortcuts">
      <h4>Lienzo</h4>
      ${row('Pan', 'Rueda', 'Espacio + arrastrar', 'Botón central')}${row('Zoom al cursor', MOD + ' + rueda', 'Pinch')}
      ${row('Acercar / alejar', '+', '−')}${row('Zoom 100%', MOD + '+0')}${row('Ajustar a pantalla', 'Shift+1')}${row('Ajustar a selección', 'Shift+2')}
      ${row('Herramienta mover / mano', 'V', 'H')}
      <h4>Cards y contenedores</h4>
      ${row('Nueva card', 'N')}${row('Editar card', 'Enter', 'Doble clic')}${row('Seleccionar / sumar', 'Clic', 'Shift+clic')}
      ${row('Selección por recuadro', 'Arrastrar fondo')}${row('Seleccionar raíces', MOD + '+A')}${row('Mover 1 px / 10 px', '←↑→↓', 'Shift+flechas')}
      ${row('Anidar / sacar', 'Soltar dentro / fuera')}${row('Desactivar snap al arrastrar', 'Alt')}${row('Duplicar', MOD + '+D')}${row('Eliminar', 'Supr', 'Backspace')}
      ${row('Conectar o anidar', 'Arrastrar desde un puerto')}${row('Redimensionar contenedor', 'Esquina inferior derecha')}
      <h4>Historial</h4>
      ${row('Deshacer', MOD + '+Z')}${row('Rehacer', MOD + '+Shift+Z', MOD + '+Y')}${row('Cancelar / deseleccionar', 'Esc')}${row('Este panel', '?')}
    </div></div><footer><button class="btn primary" id="closeSc2">Cerrar</button></footer></div>`;
  const d = $('#shortcutsDialog');
  $('#closeSc').onclick = $('#closeSc2').onclick = () => d.close();
  d.showModal();
}

/* =========================================================
   19. Botones de la UI e inicialización
   ========================================================= */
$('#btnNew').addEventListener('click', e => { const r = e.currentTarget.getBoundingClientRect(); showNewMenu(r.left, r.bottom + 4); });
$('#btnLayout').addEventListener('click', autoLayout);
$('#btnUndo').addEventListener('click', undo);
$('#btnRedo').addEventListener('click', redo);
$('#btnHelp').addEventListener('click', openShortcuts);
$('#toolSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setTool(b.dataset.tool); });
$('#zoomIn').addEventListener('click', () => zoomStep(1.25));
$('#zoomOut').addEventListener('click', () => zoomStep(1 / 1.25));
$('#zoomFit').addEventListener('click', () => fitToScreen());
$('#zoomLabel').addEventListener('click', () => setZoom(1));
viewport.addEventListener('pointerdown', () => { if (innerWidth <= 720 && adminPanel.classList.contains('open')) toggleAdmin(false); });

function init() {
  applyTheme();
  measureViewport();
  applySettingsUI();
  renderAll();
  updateUndoButtons();
  if (firstRun) {
    // Primera carga: acomodar el ejemplo y encuadrarlo
    const target = computeLayout();
    for (const [id, p] of target) { const n = nodeById(id); n.x = p.x; n.y = p.y; }
    renderAll();
    fitToScreen(null, false);
    persist();
  } else applyCamera();
  setSaveStatus('Guardado');
}
init();
</script>
